name: Agent Leases

on:
  push:
    branches: [main, agent-leases-adapter]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mikolalysenko/agent-leases
          path: agent-leases-checkout
          persist-credentials: false
      - name: Install sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check the observer
        run: python3 -m unittest discover -s adapters/agent_leases -p test_adapter.py
      - name: Exercise every interface and sandbox interaction
        run: python3 adapters/agent_leases/main.py --repo agent-leases-checkout --output artifacts/leases
      - name: Summarize
        if: always()
        run: |
          if [ -f artifacts/leases/report.md ]; then
            cat artifacts/leases/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lease-matrix
          path: artifacts/leases
